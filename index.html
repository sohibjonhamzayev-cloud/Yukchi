V.order=()=>{const o=O.find(x=>x.id==arg),l=ld(o.load_id)||{from:'—',to:'—',cargo:'',w:0},i=SK.indexOf(o.status),isD=o.driver_id==U.id,done=RT.includes(o.id),other=isD?nm(o.shipper_id):nm(o.driver_id),c=CT[o.id],Q=isD?['Yuk tayyor edimi?','Kelishilgan narxga amal qildimi?','Yuklash tezligi']:['Vaqtida keldimi?','Muomala','Yukni ehtiyot qildimi?'],rl=Lo.filter(x=>x.st=='open'&&DP&&x.from==DP.current_city).length,fmt=d=>new Date(d).toLocaleString('ru',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
 return hd(`${l.from} → ${l.to}`,1)+`<main><div class=card><div class=row><b>${o.order_no||''}</b><span class=badge>${o.status=='cancelled'?'Bekor qilindi':ST[i]}</span></div><div class=row><b>${P(o.price_uzs)}</b></div><div class=m>${l.cargo} · ${l.w} t · ${other}</div><div class=bar>${J(ST.map((x,k)=>`<i class="${k<=i?'on':''}"></i>`))}</div>${J(ST.map((x,k)=>`<div class="step ${k<=i?'on':''}">${k<i||i==5?ic('ok',16):k==i?ic('dot',16):ic('circ',16)} ${x}</div>`))}${isD&&i==1?`<label class="btn n" style="cursor:pointer">${ic('cam',16)} Yuklash rasmi (ixtiyoriy) ${LP[o.id]?ic('ok',15):''}<input type=file accept="image/*" capture=environment hidden onchange="upLoad('${o.id}',this)"></label>`:''}${isD&&i>=0&&i<4?`<button class="btn g" onclick="adv('${o.id}')">KEYINGI: ${ST[i+1].toUpperCase()}</button>`:''}${i>=0&&i<2?`<button class="btn o" onclick="cancelO('${o.id}')">Buyurtmani bekor qilish</button>`:''}</div>
 <div class=card><b>${ic('user',16)} Aloqa</b>${c?`<div style="margin:6px 0">${c.name}</div><a class="btn s g" href="tel:+${String(c.phone).replace(/^\+/,'')}">+${String(c.phone).replace(/^\+/,'')}</a>`:`<div class=m>Aloqa ma'lumoti buyurtma tasdiqlangach ochiladi.</div>`}<div class=m style="margin-top:6px">To'lov: ilovadan tashqarida. Kafolatli to'lov tez orada.</div></div>
 <div class=card><b>${ic('clock',16)} Tarix</b>${J(EV.map(e=>`<div class=row style="padding:5px 0"><span>${ST[SK.indexOf(e.status)]||'Bekor qilindi'}</span><span class=m>${fmt(e.at)}${e.photo_path?` <a onclick="openPh('${e.photo_path}')" style="text-decoration:underline">${ic('cam',13)}</a>`:''}</span></div>`))}</div>
 ${i==4&&isD?`<div class=card><b>Yuk yetkazildimi?</b><label class="btn n" style="cursor:pointer">${ic('cam',16)} Yetkazib berish rasmi ${DEL[o.id]?ic('ok',15):''}<input type=file accept="image/*" capture=environment hidden onchange="upDel('${o.id}',this)"></label><label class=row style="margin:8px 0"><span>Yuk qabul qilinganini tasdiqlayman (imzo)</span><input type=checkbox style="width:auto" ${DS[o.id]?'checked':''} onchange="DS['${o.id}']=this.checked"></label><button class=btn onclick="finish('${o.id}')">BUYURTMANI YAKUNLASH</button></div>`:i==4?`<div class=card><span class=m>Haydovchi yetkazib berishni tasdiqlaydi. Reyting shundan keyin ochiladi.</span></div>`:''}
 ${i==5&&!done?`<div class=card><b>${isD?'Yuk egasini':'Haydovchini'} baholang</b>${J(Q.map((t,k)=>`<label>${t}</label><select id=q${k}>${opts([5,4,3,2,1],5)}</select>`))}<input id=rc placeholder="Izoh"><button class=btn onclick="rateIt('${o.id}')">BAHOLASH</button></div>`:i==5?`<div class=card><span class=ok>Baholandi ${ic('ok',15)}</span></div>`:''}
 ${isD&&i>=4?`<div class=card><b>Siz ${DP.current_city}dasiz.</b><div class=m>${rl} ta qaytish yuki mos keladi.</div><button class=btn onclick="RET=1;go('ret')">${ic('repeat',17)} QAYTISH YUKLARINI KO'RISH</button></div>`:''}
 <div class=pad><button class="btn o" onclick="go('thread','${o.id}')">${ic('chat',17)} Chat</button><button class="btn o" onclick="complain('${o.id}')">Shikoyat yuborish</button></div></main>`};
V.ret=()=>{const v=AV(),home='Toshkent',L=Lo.filter(l=>l.st=='open'&&l.from==DP.current_city).map(l=>({l,m:match(l,v)})).filter(x=>x.m>0).sort((a,b)=>((b.l.to==DP.destination_city)-(a.l.to==DP.destination_city))||b.m-a.m);
 return shell('Qaytish yuki',1,`<div class=card><h2 style=margin:0>${ic('repeat',20)} Qaytish yuki</h2>${DP.current_city==home?`<p>Siz ${home}dasiz. Qaytish yukini ko'rish uchun yo'ldagi shaharni tanlang (Bosh sahifa → Hozirgi joy).</p>`:`<p>Siz ${DP.current_city}dasiz.</p><p><b>Qayerga qaytasiz?</b></p>${RET?'':`<button class=btn onclick="RET=1;render()">${home.toUpperCase()}</button>`}`}</div>${RET&&DP.current_city!=home?`<div class=pad><b>${L.length} ta qaytish yuki topildi.</b></div>${J(L.map(x=>lcard(x.l,x.m)))}`:''}`)};
V.free=()=>shell("Bo'sh mashina",1,`<div class=card><div class=f2><div><label>Hozir</label><select id=f1>${opts(C,DP.current_city)}</select></div><div><label>Boraman</label><select id=f2>${opts(C,DP.destination_city)}</select></div></div><label>Transport</label><input value="${catOf(+AV().capacity_tons)} t · ${BODY[AV().body]}" disabled><div class=f2><div><label>Bo'sh</label><select id=f3>${opts(['Bugun','Ertaga'])}</select></div><div><label>Vaqt</label><input id=f4 value="18:00"></div></div><button class=btn onclick=freeSave()>E'LON QILISH</button>${DP.is_free?`<button class="btn o" onclick=freeOff()>Statusni o'chirish</button>`:''}</div>`);
V.sHome=()=>{const my=Lo.filter(l=>l.shipper==U.id&&l.st=='open').length,of=Of.filter(o=>(ld(o.load_id)||{}).shipper==U.id).length,dn=O.filter(o=>o.status=='completed'&&(ld(o.load_id)||{}).shipper==U.id).length;
 return shell('YUKCHI',0,`<div class=pad><h2>Salom, ${U.name.split(' ')[0]} 👋</h2></div><div class=kp><div><b>${my}</b>faol yuk</div><div><b>${of}</b>takliflar</div><div><b>${dn}</b>bajarilgan</div></div><div class=pad style="margin-top:12px"><button class=btn onclick="go('post')">${ic('package',18)} + YUK JOYLASH</button><button class="btn n" onclick="go('trucks')">${ic('truck',18)} MASHINA TOPISH</button></div>${nt()}`)};
V.post=()=>hd('Yuk joylash',1)+`<main class=pad><div class=f2><div><label>Qayerdan</label><select id=p1>${opts(C)}</select></div><div><label>Qayerga</label><select id=p2>${opts(C,'Samarqand')}</select></div></div><label>Yuk turi</label><input id=p3 value="Qurilish materiali"><div class=f2><div><label>Og'irligi (t)</label><input id=p4 type=number value=8></div><div><label>Kuzov turi</label><select id=p6>${oB(BK,'tent')}</select></div><div><label>Sana</label><select id=p7>${opts(['Bugun','Ertaga','Indinga'])}</select></div><div><label>Vaqt</label><input id=p8 value="15:00"></div></div><label>Narx (so'm)</label><input id=p5 type=number value=3500000><label>Turi</label><select id=p10>${opts(['Oddiy','Shoshilinch'])}</select><label>Izoh</label><textarea id=p9></textarea><button class=btn onclick=post()>YUKNI JOYLASH</button></main>`;
V.trucks=()=>{const w=T2.w,L=DR.filter(d=>d.current_city==T2.from).map(d=>({d,v:VA.find(x=>x.owner_id==d.user_id)})).filter(x=>x.v&&+x.v.capacity_tons>=w).sort((a,b)=>((b.d.destination_city==T2.to)-(a.d.destination_city==T2.to))||(b.d.is_free-a.d.is_free));
 return shell('Mos mashinalar',0,`<div class=card><div class=f2><select onchange="T2.from=this.value;render()">${opts(C,T2.from)}</select><select onchange="T2.to=this.value;render()">${opts(C,T2.to)}</select></div><label>Yuk og'irligi (tonna)</label><input type=number value=${w} onchange="T2.w=+this.value||1;render()"><div class=m>Kerakli transport: ${catOf(w)} t</div></div>${J(L.map(({d,v})=>`<div class=card><div class=row><b>${nm(d.user_id)}</b><span>${ic('star',15,1)} ${rate(d)}</span></div><div class=row><span class=m>${v.brand} ${v.model} · ${BODY[v.body]}</span>${bg(catOf(+v.capacity_tons))}</div><div class=m>${d.completed} ta yuk · Bugun ${d.current_city}da${d.is_free?" · Bo'sh mashina":''}</div><div class=row><span class=ok>${v.verified?ic('ok',15)+' Tasdiqlangan':'Tekshiruvda'}</span><button class="btn s" onclick="go('dprof','${d.user_id}')">TANLASH</button></div></div>`))||empty('Mos transport topilmadi.')}`)};
V.dprof=()=>{const d=DR.find(x=>x.user_id==arg),v=VA.find(x=>x.owner_id==arg),my=Lo.filter(l=>l.shipper==U.id&&l.st=='open');return hd(nm(arg),1)+`<main><div class=card><h2 style=margin:0>${nm(arg)}</h2><div>${ic('star',15,1)} ${rate(d)} · ${d.completed} ta yuk</div><p class=m>${d.completed-d.cancelled} muvaffaqiyatli · ${d.cancelled} bekor qilingan</p></div><div class=card><div class=row><b>${v.brand} ${v.model}</b>${bg(catOf(+v.capacity_tons))}</div><div class=m>${BODY[v.body]} · ${v.plate_number} · ${d.current_city} → ${d.destination_city}</div></div>${hist()}<div class=card><label>Qaysi yuk uchun</label><select id=pl>${J(my.map(l=>`<option value="${l.id}">${l.from} → ${l.to} · ${l.w} t</option>`))}</select><button class=btn onclick="invite('${arg}')">TANLASH</button></div></main>`};
V.chat=()=>shell('Chat',0,J(O.filter(o=>o.status!='cancelled').map(o=>{const l=ld(o.load_id)||{from:'—',to:'—'};return `<div class=card onclick="go('thread','${o.id}')"><div class=row><b>${nm(o.driver_id==U.id?o.shipper_id:o.driver_id)}</b><span class=badge>${ST[SK.indexOf(o.status)]}</span></div><div class=m>${l.from} → ${l.to}</div></div>`}))||empty('Chat buyurtma tasdiqlangandan keyin ochiladi.'));
V.thread=()=>hd('Chat',1)+`<main>${J(MS.map(m=>`<div class="msg ${m.sender_id==U.id?'me':''}">${m.kind=='location'?`<a href="https://maps.google.com/?q=${m.lat},${m.lng}" target=_blank style="color:inherit">${ic('pin',15)} Joylashuv</a>`:m.attachment_path?`<a onclick="openAtt('${m.attachment_path}')" style="color:inherit;text-decoration:underline">${ic(m.kind=='image'?'cam':'clip',15)} ${m.body||'Fayl'}</a>`:(m.body||'').replace(/</g,'&lt;')}</div>`))}</main><div class=cin><div class=qk><button class="btn s o" onclick="sendLoc('${arg}')">${ic('pin',14)} LOCATION</button><label class="btn s o" style="cursor:pointer">${ic('cam',14)} RASM<input type=file accept="image/*" hidden onchange="sendFile('${arg}',this,'image')"></label><label class="btn s o" style="cursor:pointer">${ic('clip',14)} HUJJAT<input type=file hidden onchange="sendFile('${arg}',this,'doc')"></label></div><div class=row><input id=mi placeholder="Xabar yozish" onkeydown="if(event.key=='Enter')sendMsg('${arg}')"><button class="btn s" onclick="sendMsg('${arg}')">${ic('send',16)}</button></div></div>`;
V.prof=()=>{const d=U.role=='driver',x=d?DP:SP,v=AV();return shell('Profil',0,`<div class=card><h2 style=margin:0>${U.name}</h2><div>${ic('star',15,1)} ${rate(x)}</div><p>${x.completed} ta bajarilgan yuk${d?`<br>${x.cancelled} ta bekor qilingan`:''}</p><div class=ok>${ic('ok',15)} Tasdiqlangan telefon${x.verified?`<br>${ic('ok',15)} Profil tasdiqlangan`:''}</div></div>${d?`<div class=card><b>Transport</b><div>${v.brand} ${v.model} · ${BODY[v.body]} · ${catOf(+v.capacity_tons)} t</div><div class=m>${v.plate_number} · ${v.verified?'Tasdiqlangan':'Tekshiruvda'}</div></div>`:''}${hist()}<div class=card><div class=row onclick="go('legal','privacy')" style="padding:8px 0;cursor:pointer"><span>Privacy Policy</span>›</div><div class=row onclick="go('legal','terms')" style="padding:8px 0;cursor:pointer"><span>Terms</span>›</div><div class=row onclick="go('support')" style="padding:8px 0;cursor:pointer"><span>Contact Support</span>›</div></div><div class=pad><button class="btn o" onclick=logout()>Chiqish</button><button class="btn o" style="color:#E8365D" onclick=delAcc()>Hisobni o'chirish</button></div>`)};
V.legal=()=>hd(arg=='privacy'?'Privacy Policy':'Terms',1)+`<main class=pad><div class=card><p>${arg=='privacy'?"YUKCHI telefon raqamingiz, ismingiz, transport va buyurtma ma'lumotlaringizni xizmatni ko'rsatish uchun saqlaydi. Telefon raqamingiz boshqa foydalanuvchilarga ko'rsatilmaydi. Hisobingizni Profil → Hisobni o'chirish orqali istalgan vaqtda o'chirishingiz mumkin.":"YUKCHI yuk egalari va transport egalarini bog'laydigan platforma. Narx va shartlar tomonlar o'rtasida kelishiladi. Noto'g'ri ma'lumot berish hisobni bloklashga olib kelishi mumkin."}</p><p class=m>Qoralama matn. Do'konlarga chiqarishdan oldin yuridik tekshiruv va ochiq URL kerak.</p></div></main>`;
V.support=()=>hd('Contact Support',1)+`<main class=pad><label>Murojaatingiz</label><textarea id=cp placeholder="Muammo yoki savolni yozing"></textarea><button class=btn onclick=sendComplaint()>YUBORISH</button><h2>Mening murojaatlarim</h2>${J(CS.map(c=>`<div class=card><div class=row><b>${c.order_no||'Umumiy'}</b><span class=badge>${c.status=='resolved'?'Qaror chiqdi':"Ko'rib chiqilmoqda"}</span></div><div class=m>${c.role=='accused'?'Sizga nisbatan':'Sizning shikoyatingiz'}${c.note?' · '+c.note:''}</div>${c.appealable?`<button class="btn s o" onclick="appeal('${c.id}')">E'TIROZ BILDIRISH</button>`:''}</div>`))||empty("Murojaat yo'q.")}</main>`;
sb.auth.onAuthStateChange((ev)=>{if(ev=='SIGNED_OUT'&&U){U=null}});
(async()=>{const {data:{session}}=await sb.auth.getSession();session?loadMe().catch(fail):render()})();

</script></body></html>
